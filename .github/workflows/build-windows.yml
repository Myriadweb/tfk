name: Build Tauri App

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Location identifier (e.g., atlanta, chicago, denver)'
        required: true
        default: 'dimaggio'
      release_name:
        description: 'Custom release name (optional)'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set location environment variable
        run: |
          if ("${{ github.event.inputs.location }}" -ne "") {
            echo "LOCATION=${{ github.event.inputs.location }}" >> $env:GITHUB_ENV
          } else {
            echo "LOCATION=dimaggio" >> $env:GITHUB_ENV
          }
        shell: powershell

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCATION: ${{ env.LOCATION }}
        with:
          tagName: ${{ github.ref_name || format('v0.1.0-{0}', env.LOCATION) }}
          releaseName: ${{ github.event.inputs.release_name || format('Teammates for Kids - {0} {1}', env.LOCATION, github.ref_name || 'v0.1.0') }}
          releaseBody: 'Teammates for Kids application for ${{ env.LOCATION }} location'
          releaseDraft: false
          prerelease: false
