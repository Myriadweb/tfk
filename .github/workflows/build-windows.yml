env:
  APP_VERSION: '2.1.2'

name: Build Tauri App

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Location identifier (e.g., Atlanta, StLouis, dimaggio)'
        required: true
        default: 'dimaggio'
      release_name:
        description: 'Custom release name (optional)'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set location environment variable and update config
        run: |
          if ("${{ github.event.inputs.location }}" -ne "") {
            echo "LOCATION=${{ github.event.inputs.location }}" >> $env:GITHUB_ENV
            $location = "${{ github.event.inputs.location }}"
          } else {
            echo "LOCATION=dimaggio" >> $env:GITHUB_ENV
            $location = "dimaggio"
          }

          # Update the config.ts file with the selected location
          (Get-Content "src/config.ts") -replace "export const LOCATION: LocationType = '.*';", "export const LOCATION: LocationType = '$location';" | Set-Content "src/config.ts"

          # Update Tauri config
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $config.identifier = "com.teammates-for-kids-$location"
          $config.productName = "Teammates For Kids - $location"
          $config.version = "${{ env.APP_VERSION }}"
          $config.app.windows[0].title = "Teammates For Kids - $location"
          $config | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"

        shell: powershell

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false  # Disable treating warnings as errors
        with:
          tagName: ${{ env.APP_VERSION }}-${{ env.LOCATION }}
          releaseName: ${{ github.event.inputs.release_name || format('Teammates for Kids - {0} v{1}', env.LOCATION, env.APP_VERSION) }}
          releaseBody: 'Teammates for Kids application for ${{ env.LOCATION }} location'
          releaseDraft: false
          prerelease: false
